<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asset/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Document</title>
</head>
<body>
    <div class="main mt-3" >
        <div class="container-fluid d-flex row" style="width: 100%;">
            <div class="form-register col-5">
                <form action="#" class="mt-5 mb-5" style="margin-left: 30%;">
                    <h3 class="fs-3 fw-bold">Đăng nhập tài khoản</h3>
                    
                    <label for="email" class="form-label mt-4">Email*</label>
                    <input type="email" class="p-2 form-control input-group" id="email" placeholder="Tài khoản hoặc Email của bạn" required>
    
                    <label for="password" class="form-label mt-4">Mật khẩu*</label>
                    <div class="input-group">
                        <input type="password" placeholder="Mật khẩu" class="form-control p-2 password-input" required>
                        <span class="input-group-text" onclick="togglePassword(this)">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
    
                    <div class="d-flex justify-content-end mt-3">
                        <a href="#" class="text-decoration-none" style="color: #72be43">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4 button-radius border-0" style="background-color: #72be43;">ĐĂNG NHẬP</button>
                </form>
            </div>
            <div class="form-login col-7">
                <form action="#" class="mt-5 mb-5">
                    <h3 class="fs-3 fw-bold">Đăng ký tài khoản</h3>
                    <div class="d-flex row" style="margin-left: 2%; margin-right: 20%;">
                        <div class="form-left col-6">
                            <label class="form-label mt-4">Họ*</label>
                            <input type="text" class="p-2 form-control input-group" id="email" required>
    
                            <label class="form-label mt-4">Giới tính*</label>
                            <select class="form-select p-2" aria-label="Default select example">
                                <option selected>Chọn giới tính</option>
                                <option value="1">Nam</option>
                                <option value="2">Nữ</option>
                                <option value="3">Khác</option>
                            </select>
    
                            <label for="password" class="form-label mt-4">Mật khẩu*</label>
                            <div class="input-group">
                                <input type="password" class="form-control p-2 password-input" required>
                                <span class="input-group-text" onclick="togglePassword(this)">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div class="form-right col-6">
                            <label class="form-label mt-4">Tên đệm và tên*</label>
                            <input type="text" class="p-2 form-control input-group" id="name" required>
    
                            <label for="email" class="form-label mt-4">Địa chỉ email*</label>
                            <input type="email" class="p-2 form-control input-group" id="email" required>
    
                            <label for="password" class="form-label mt-4">Nhập lại mật khẩu*</label>
                            <div class="input-group">
                                <input type="password" class="form-control p-2 password-input" required>
                                <span class="input-group-text" onclick="togglePassword(this)">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>
    
                        <label for="phone" class="form-label mt-4">Số điện thoại*</label>
                        <input type="text" class="form-control input-group" id="phone-number" required>
                        
                        <label for="date" class="form-label mt-4">Ngày sinh*</label>
                        <input type="date" class="form-control w-25 input-group" id="date" required>
    
                        <label for="phone" class="form-label mt-4">Tỉnh/Thành phố*</label>
                        <select class="form-select p-2" aria-label="Default select example">
                            <option selected>Chọn Tỉnh/Thành phố</option>
                            <option value="Hồ Chí Minh">Hồ Chí Minh</option>
                            <option value="Hà Nội">Hà Nội</option>
                            <option value="Đà Nẵng">Đà Nẵng</option>
                            <option value="Bình Dương">Bình Dương</option>
                            <option value="Đồng Nai">Đồng Nai</option>
                            <option value="Bà Rịa - Vũng Tàu">Bà Rịa - Vũng Tàu</option>
                            <option value="Cần Thơ">Cần Thơ</option>
                            <option value="Khánh Hòa">Khánh Hòa</option>
                            <option value="Hải Phòng">Hải Phòng</option>
                            <option value="An Giang">An Giang</option>
                            <option value="Bắc Giang">Bắc Giang</option>
                            <option value="Bắc Kạn">Bắc Kạn</option>
                            <option value="Bạc Liêu">Bạc Liêu</option>
                            <option value="Bắc Ninh">Bắc Ninh</option>
                            <option value="Bến Tre">Bến Tre</option>
                            <option value="Bình Phước">Bình Phước</option>
                            <option value="Bình Thuận">Bình Thuận</option>
                            <option value="Bình Định">Bình Định</option>
                            <option value="Cà Mau">Cà Mau</option>
                            <option value="Cao Bằng">Cao Bằng</option>
                            <option value="Gia Lai">Gia Lai</option>
                            <option value="Hà Giang">Hà Giang</option>
                            <option value="Hà Nam">Hà Nam</option>
                            <option value="Hà Tĩnh">Hà Tĩnh</option>
                            <option value="Hải Dương">Hải Dương</option>
                            <option value="Hậu Giang">Hậu Giang</option>
                            <option value="Hòa Bình">Hòa Bình</option>
                            <option value="Hưng Yên">Hưng Yên</option>
                            <option value="Kiên Giang">Kiên Giang</option>
                            <option value="Kon Tum">Kon Tum</option>
                            <option value="Lai Châu">Lai Châu</option>
                            <option value="Lâm Đồng">Lâm Đồng</option>
                            <option value="Lạng Sơn">Lạng Sơn</option>
                            <option value="Lào Cai">Lào Cai</option>
                            <option value="Long An">Long An</option>
                            <option value="Nam Định">Nam Định</option>
                            <option value="Nghệ An">Nghệ An</option>
                            <option value="Ninh Bình">Ninh Bình</option>
                            <option value="Ninh Thuận">Ninh Thuận</option>
                            <option value="Phú Thọ">Phú Thọ</option>
                            <option value="Phú Yên">Phú Yên</option>
                            <option value="Quảng Bình">Quảng Bình</option>
                            <option value="Quảng Nam">Quảng Nam</option>
                            <option value="Quảng Ngãi">Quảng Ngãi</option>
                            <option value="Quảng Ninh">Quảng Ninh</option>
                            <option value="Quảng Trị">Quảng Trị</option>
                            <option value="Sóc Trăng">Sóc Trăng</option>
                            <option value="Sơn La">Sơn La</option>
                            <option value="Tây Ninh">Tây Ninh</option>
                            <option value="Thái Bình">Thái Bình</option>
                            <option value="Thái Nguyên">Thái Nguyên</option>
                            <option value="Thanh Hóa">Thanh Hóa</option>
                            <option value="Thừa Thiên Huế">Thừa Thiên Huế</option>
                            <option value="Tiền Giang">Tiền Giang</option>
                            <option value="Trà Vinh">Trà Vinh</option>
                            <option value="Tuyên Quang">Tuyên Quang</option>
                            <option value="Vĩnh Long">Vĩnh Long</option>
                            <option value="Vĩnh Phúc">Vĩnh Phúc</option>
                            <option value="Yên Bái">Yên Bái</option>
                            <option value="Đắk Lắk">Đắk Lắk</option>
                            <option value="Đắk Nông">Đắk Nông</option>
                            <option value="Điện Biên">Điện Biên</option>
                            <option value="Đồng Tháp">Đồng Tháp</option>
                        </select>
    
                        <div class="d-flex mt-4">
                            <input type="checkbox" class="form-check-input me-2" id="check" required>
                            <label class="form-check-label" for="check">Tôi đồng ý với các điều khoản và điều kiện của BHD Star</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-4 button-radius border-0" style="background-color: #72be43;">ĐĂNG KÝ</button>
    
    
                    </div>
                </form>
            </div>
        </div>
        
    </div>

    <script>
        function togglePassword(icon) {
            let input = icon.parentElement.querySelector(".password-input");
            let eyeIcon = icon.querySelector("i");

            if (input.type === "password") {
                input.type = "text";
                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");
            } else {
                input.type = "password";
                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");
            }
        }
    </script>
</body>
</html>
